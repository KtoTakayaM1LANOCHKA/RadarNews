# Конфигурация Amvera Cloud. База и загруженные файлы хранятся в постоянном хранилище /data.
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.12
build:
  requirementsPath: requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
  containerPort: 8000
  persistenceMount: /data
